name: Build RDX-TV v2 (Android TV, Samsung Tizen & LG webOS)

on:
  push:
    branches:
      - main
      - v2
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-tv:
    name: Android TV APKs (32-bit & 64-bit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install frontend dependencies & sync Android assets
        run: |
          npm ci
          npm run build:android-assets

      - name: Build & Sign Android TV APKs (armeabi-v7a + arm64-v8a)
        run: |
          cd android-tv
          gradle assembleRelease --no-daemon
          cd ..

          mkdir -p artifacts
          keytool -genkeypair -v -keystore /tmp/rdx-tv.keystore -alias rdxtv \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass rdxtv123 -keypass rdxtv123 \
            -dname "CN=RDX-TV,O=RDX,C=UA"

          BUILD_TOOLS=$(ls -d "$ANDROID_HOME/build-tools/"* | sort -V | tail -n 1)

          for ABI in armeabi-v7a arm64-v8a; do
            APK=$(find android-tv/app/build/outputs/apk/release -name "*${ABI}*.apk" | head -n 1)
            if [ -z "$APK" ]; then
              echo "Release APK not found for $ABI!"
              find android-tv/app/build/outputs/apk -type f || true
              exit 1
            fi
            OUT_ARCH="${ABI/armeabi-v7a/armv7}"
            OUT_ARCH="${OUT_ARCH/arm64-v8a/arm64}"
            OUT_NAME="RDX-TV-android-tv-${OUT_ARCH}.apk"
            "$BUILD_TOOLS/zipalign" -f -p 4 "$APK" "/tmp/rdx-${ABI}-aligned.apk"
            "$BUILD_TOOLS/apksigner" sign \
              --ks /tmp/rdx-tv.keystore \
              --ks-pass pass:rdxtv123 \
              --key-pass pass:rdxtv123 \
              --ks-key-alias rdxtv \
              --out "artifacts/${OUT_NAME}" \
              "/tmp/rdx-${ABI}-aligned.apk"
          done
          ls -lh artifacts/

      - name: Upload Android TV APKs
        uses: actions/upload-artifact@v4
        with:
          name: RDX-TV-android-tv-apk
          path: artifacts/*.apk

  build-tizen:
    name: Samsung Tizen (.wgt)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Build Tizen bundle
        run: |
          npm ci
          npm run build:tizen
          mkdir -p artifacts
          (cd dist-tizen && zip -r ../artifacts/RDX-TV-tizen.wgt .)
          (cd dist-tizen && zip -r ../artifacts/RDX-TV-tizen-dist.zip .)
          ls -lh artifacts/

      - name: Upload Samsung Tizen Bundle
        uses: actions/upload-artifact@v4
        with:
          name: RDX-TV-tizen-bundle
          path: artifacts/*

  build-webos:
    name: LG webOS (.ipk)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Build & Package LG webOS IPK (with local DoH service)
        run: |
          npm ci
          npm run build:webos
          mkdir -p artifacts
          npm install -g @webos-tools/cli
          ares-package --no-minify dist-webos webos/service -o artifacts/
          ls -lh artifacts/

      - name: Upload LG webOS IPK
        uses: actions/upload-artifact@v4
        with:
          name: RDX-TV-webos-ipk
          path: artifacts/*.ipk

  publish-release:
    name: Publish GitHub Release
    needs: [build-android-tv, build-tizen, build-webos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download Android TV APKs
        uses: actions/download-artifact@v4
        with:
          name: RDX-TV-android-tv-apk
          path: release-assets

      - name: Download Samsung Tizen Bundle
        uses: actions/download-artifact@v4
        with:
          name: RDX-TV-tizen-bundle
          path: release-assets

      - name: Download LG webOS IPK
        uses: actions/download-artifact@v4
        with:
          name: RDX-TV-webos-ipk
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
