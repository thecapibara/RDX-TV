name: Release RDX

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libssl-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav \
            gstreamer1.0-tools \
            gstreamer1.0-vaapi

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app & create Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: v__VERSION__
          releaseName: 'RDX v__VERSION__'
          releaseBody: |
            ## RDX v__VERSION__ — AppImage Host Codecs Fix, Movie Resume & Scroll Seam Polish

            Cross-platform native desktop streaming client (Linux, Windows, macOS) built with **Rust (Tauri v2)**, **React 19**, **Tailwind CSS v4**, and **HLS.js**, inspired by modern Android TV & Smart TV interfaces with an *Obsidian Crimson* aesthetic.

            ---

            ### 🇺🇦 Що нового у версії __VERSION__:

            - **🐧 Виправлення відтворення відео в Linux AppImage (Host GStreamer Codecs)**:
              - Вимкнено ізоляцію `bundleMediaFramework` всередині AppImage, щоб додаток без конфліктів ABI використовував системні кодеки GStreamer (H.264/AAC) на Linux Mint, Ubuntu, Fedora та Arch.

            - **🎬 Відновлення прогресу фільмів із картки каталогу**:
              - Виправлено проблему, коли фільм починався з `0:00` при відкритті через картку фільму та модалку деталей (`MediaDetailsModal`), якщо `data-id` картки був відсутній або відрізнявся від канонічного ID сторінки.

            - **✨ Візуальне полірування інтерфейсу (UI Polish)**:
              - Усунуто тонку 1px горизонтальну смужку на нижній межі `HeroBanner` над секцією «Продовжити перегляд» під час скролу.
              - Покращено синхронізацію метаданих медіасесії під час відтворення.

            - **📥 Усі можливості попередніх версій збережено та вдосконалено**:
              - Точна синхронізація локального часу з системним годинником (`chrono::Local`).
              - Розумне автозникання контролерів міні-плеєра (Mini-Player Autohide) та універсальні шорткати (`F`, `Space`, `M`, `S`, `L`, `I`).
              - Оверлей статистики потоку (`I`), мультивибір серій у завантажувачі та автооновлення Minisign ED25519.

            ---

            ### 🇬🇧 What's New in v__VERSION__:

            - **🐧 Linux AppImage Video Playback Fix (Host GStreamer Codecs)**:
              - Disabled `bundleMediaFramework` isolation in AppImage so it uses the host system's native GStreamer 1.0 codecs (H.264/AAC) without ABI mismatches across Linux Mint, Ubuntu, Fedora, and Arch.

            - **🎬 Movie Resume from Catalog Cards**:
              - Fixed an issue where movies started from `0:00` when launched via a catalog `MediaCard` / `MediaDetailsModal` instead of "Continue Watching" due to missing or mismatched `data-id` vs canonical page ID.

            - **✨ UI & Playback Polish**:
              - Eliminated the 1px subpixel seam at the bottom edge of `HeroBanner` above "Continue Watching" during scroll.
              - Improved `MediaSession` metadata synchronization during playback.

            ---

            ### 📦 Завантаження та встановлення / Download & Installation

            | Platform | Package | Description |
            | :--- | :--- | :--- |
            | **Windows** | `RDX___VERSION___x64-setup.exe` | Recommended installer for Windows 10 & 11 |
            | **Windows** | `RDX___VERSION___x64_en-US.msi` | Windows Installer package |
            | **Linux (Universal)** | `RDX___VERSION___amd64.AppImage` | Portable binary with bundled GStreamer codecs (Arch, Ubuntu, Fedora, Debian) |
            | **Linux (Debian/Ubuntu)** | `RDX___VERSION___amd64.deb` | Standard package for Ubuntu / Debian / Linux Mint |
            | **Linux (RPM)** | `RDX-__VERSION__-1.x86_64.rpm` | Package for Fedora / openSUSE / RHEL |
            | **macOS** | `RDX___VERSION___aarch64.dmg` | Disk Image for Apple Silicon Mac (M1/M2/M3/M4) |
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  publish:
    needs: release
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish draft release once all builds finish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ github.ref_name }}" --repo "${{ github.repository }}" --draft=false
