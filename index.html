<!doctype html>
<html lang="uk" class="dark" style="background-color: var(--bg-base, #000000); color: #f4f4f5; scrollbar-gutter: stable;">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RDX-TV</title>
    <script>
      (function() {
        try {
          var a = localStorage.getItem("rdx_accent_color") || "crimson";
          var b = localStorage.getItem("rdx_bg_theme") || "oled";
          document.documentElement.setAttribute("data-accent", a);
          document.documentElement.setAttribute("data-bg", b);
          var cm = navigator.userAgent.match(/Chrome\/(\d+)/);
          if (cm && parseInt(cm[1], 10) < 90) {
            document.documentElement.classList.add("rdx-low-gpu");
          }
        } catch(e) {}
      })();
    </script>
    <style>
      :root,
      [data-accent="crimson"] {
        --accent-400: #fb7185;
        --accent-500: #f43f5e;
        --accent-600: #e11d48;
        --accent-950: #4c0519;
      }
      [data-accent="amethyst"] {
        --accent-400: #c084fc;
        --accent-500: #a855f7;
        --accent-600: #9333ea;
        --accent-950: #3b0764;
      }
      [data-accent="sapphire"] {
        --accent-400: #60a5fa;
        --accent-500: #3b82f6;
        --accent-600: #2563eb;
        --accent-950: #172554;
      }
      [data-accent="emerald"] {
        --accent-400: #34d399;
        --accent-500: #10b981;
        --accent-600: #059669;
        --accent-950: #022c22;
      }
      [data-accent="amber"] {
        --accent-400: #fbbf24;
        --accent-500: #f59e0b;
        --accent-600: #d97706;
        --accent-950: #451a03;
      }

      :root,
      [data-bg="oled"] {
        --bg-base: #000000;
        --bg-surface: #050507;
        --bg-elevated: #0f0f13;
      }
      [data-bg="obsidian"] {
        --bg-base: #09090b;
        --bg-surface: #111217;
        --bg-elevated: #181920;
      }

      html {
        background-color: var(--bg-base, #000000);
        color: #f4f4f5;
        overflow-y: auto;
        overflow-x: clip;
      }
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: var(--bg-base, #000000);
        color: #f4f4f5;
        font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
        overflow-x: clip;
      }
      #rdx-splash {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: var(--bg-base, #000000);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif !important;
        overflow: hidden;
        user-select: none;
        transition:
          opacity 0.5s cubic-bezier(0.22, 1, 0.36, 1),
          transform 0.5s cubic-bezier(0.22, 1, 0.36, 1),
          filter 0.5s cubic-bezier(0.22, 1, 0.36, 1);
      }
      #rdx-splash.rdx-splash-hide {
        opacity: 0;
        transform: scale(1.05);
        filter: blur(10px);
        pointer-events: none;
      }
      .rdx-logo-stage {
        position: relative;
        width: 176px;
        height: 176px;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: visible;
      }
      .rdx-tv-antennas {
        position: absolute;
        top: -42px;
        right: -42px;
        width: 116px;
        height: 104px;
        overflow: visible;
        z-index: 1;
        pointer-events: none;
        transform-origin: 24px 82px;
        opacity: 0;
        transform: scale(0) rotate(-18deg);
        animation: rdxAntennaPop 0.52s cubic-bezier(0.34, 1.56, 0.64, 1) 0.78s forwards;
      }
      .rdx-pulse-ring {
        position: absolute;
        inset: 14px;
        z-index: 0;
        border-radius: 40px;
        border: 1.5px solid var(--accent-500, #f43f5e);
        box-shadow: 0 0 50px var(--accent-600, rgba(225, 29, 72, 0.45));
        opacity: 0;
        animation: rdxRingWave 2.2s cubic-bezier(0.16, 1, 0.3, 1) 0.25s infinite;
      }
      .rdx-pulse-ring-2 {
        position: absolute;
        inset: 14px;
        z-index: 0;
        border-radius: 40px;
        border: 1px solid var(--accent-400, #fb7185);
        opacity: 0;
        animation: rdxRingWave 2.2s cubic-bezier(0.16, 1, 0.3, 1) 0.75s infinite;
      }
      .rdx-boot-logo-wrap {
        position: relative;
        z-index: 2;
        width: 164px;
        height: 164px;
        border-radius: 38px;
        overflow: hidden;
        box-shadow:
          0 28px 70px rgba(0, 0, 0, 0.95),
          0 0 60px var(--accent-600, rgba(225, 29, 72, 0.18));
        animation: rdxHeroLogoIn 0.85s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      .rdx-boot-logo {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
      }
      .rdx-logo-sheen {
        position: absolute;
        inset: -40%;
        background: linear-gradient(
          115deg,
          transparent 35%,
          rgba(255, 255, 255, 0.22) 48%,
          var(--accent-500, rgba(225, 29, 72, 0.25)) 52%,
          transparent 65%
        );
        transform: translateX(-120%) rotate(12deg);
        animation: rdxSheenSweep 1.6s cubic-bezier(0.22, 1, 0.36, 1) 0.35s infinite;
        pointer-events: none;
      }
      .rdx-title-row {
        position: relative;
        margin-top: 32px;
        display: inline-flex;
        align-items: baseline;
        justify-content: center;
        font-size: 64px;
        font-weight: 900;
        letter-spacing: -0.04em;
        line-height: 1;
        color: #ffffff;
      }
      .rdx-char {
        display: inline-block;
        opacity: 0;
        transform: translateY(22px) scale(0.85);
        filter: blur(8px);
        animation: rdxCharReveal 0.55s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      .rdx-char-1 { animation-delay: 0.22s; }
      .rdx-char-2 { animation-delay: 0.36s; }
      .rdx-char-3 { animation-delay: 0.50s; }
      .rdx-char-tv {
        color: #ffffff;
        margin-left: 2px;
        opacity: 0;
        transform: translateX(-10px) scale(0.7);
        filter: blur(6px);
        animation: rdxTvPop 0.52s cubic-bezier(0.34, 1.56, 0.64, 1) 0.78s forwards;
      }
      .rdx-char-tv-dash {
        color: var(--accent-500, #f43f5e);
        text-shadow: 0 0 20px var(--accent-500, rgba(244, 63, 94, 0.8));
      }
      .rdx-char-dot {
        color: var(--accent-600, #e11d48);
        text-shadow: 0 0 28px var(--accent-500, rgba(225, 29, 72, 0.9));
        animation-delay: 0.92s;
      }
      .rdx-TypeCursor {
        position: absolute;
        right: -12px;
        bottom: 6px;
        width: 4px;
        height: 46px;
        background-color: var(--accent-600, #e11d48);
        box-shadow: 0 0 16px var(--accent-500, #e11d48);
        animation: rdxCursorBlink 0.75s step-end infinite;
      }
      .rdx-progress-bar {
        margin-top: 28px;
        width: 200px;
        height: 3px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        overflow: hidden;
        position: relative;
      }
      .rdx-progress-fill {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 100%;
        background: linear-gradient(90deg, var(--accent-950, #9f1239), var(--accent-600, #e11d48), var(--accent-400, #fb7185));
        box-shadow: 0 0 16px var(--accent-500, #e11d48);
        transform-origin: left;
        animation: rdxProgressLoad 1.7s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }
      @keyframes rdxHeroLogoIn {
        0% {
          opacity: 0;
          transform: scale(0.68) translateY(18px);
          filter: blur(12px);
        }
        60% {
          opacity: 1;
          transform: scale(1.04) translateY(-2px);
          filter: blur(0px);
        }
        100% {
          opacity: 1;
          transform: scale(1) translateY(0);
          filter: blur(0px);
        }
      }
      @keyframes rdxRingWave {
        0% {
          opacity: 0.75;
          transform: scale(0.95);
        }
        100% {
          opacity: 0;
          transform: scale(1.42);
        }
      }
      @keyframes rdxSheenSweep {
        0% { transform: translateX(-130%) rotate(12deg); }
        100% { transform: translateX(130%) rotate(12deg); }
      }
      @keyframes rdxCharReveal {
        0% {
          opacity: 0;
          transform: translateY(22px) scale(0.84);
          filter: blur(8px);
        }
        100% {
          opacity: 1;
          transform: translateY(0) scale(1);
          filter: blur(0px);
        }
      }
      @keyframes rdxCursorBlink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes rdxProgressLoad {
        0% { transform: scaleX(0.05); }
        100% { transform: scaleX(1); }
      }
      @keyframes rdxAntennaPop {
        0% {
          opacity: 0;
          transform: scale(0) rotate(-18deg);
        }
        65% {
          opacity: 1;
          transform: scale(1.16) rotate(4deg);
        }
        100% {
          opacity: 1;
          transform: scale(1) rotate(0deg);
        }
      }
      @keyframes rdxTvPop {
        0% {
          opacity: 0;
          transform: translateX(-10px) scale(0.7);
          filter: blur(6px);
        }
        65% {
          opacity: 1;
          transform: translateX(2px) scale(1.08);
          filter: blur(0px);
        }
        100% {
          opacity: 1;
          transform: translateX(0) scale(1);
          filter: blur(0px);
        }
      }

      /* Low-GPU / Legacy WebView (< Chrome 90) splash optimization: pure transform+opacity, zero blur */
      @keyframes rdxHeroLogoInFlat {
        0% { opacity: 0; transform: scale(0.84) translateY(14px); }
        70% { opacity: 1; transform: scale(1.03) translateY(-2px); }
        100% { opacity: 1; transform: scale(1) translateY(0); }
      }
      @keyframes rdxCharRevealFlat {
        0% { opacity: 0; transform: translateY(18px) scale(0.86); }
        100% { opacity: 1; transform: translateY(0) scale(1); }
      }
      @keyframes rdxTvPopFlat {
        0% { opacity: 0; transform: translateX(-8px) scale(0.76); }
        65% { opacity: 1; transform: translateX(2px) scale(1.06); }
        100% { opacity: 1; transform: translateX(0) scale(1); }
      }
      .rdx-low-gpu #rdx-splash {
        transition: opacity 0.35s ease-out, transform 0.35s ease-out;
      }
      .rdx-low-gpu #rdx-splash.rdx-splash-hide {
        filter: none;
        transform: scale(1.02);
      }
      .rdx-low-gpu .rdx-boot-logo-wrap {
        animation-name: rdxHeroLogoInFlat;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.85);
      }
      .rdx-low-gpu .rdx-char {
        filter: none;
        animation-name: rdxCharRevealFlat;
      }
      .rdx-low-gpu .rdx-char-tv {
        filter: none;
        animation-name: rdxTvPopFlat;
      }
      .rdx-low-gpu .rdx-pulse-ring {
        box-shadow: none;
      }
    </style>
  </head>
  <body class="bg-[#09090b] text-zinc-100 antialiased selection:bg-rose-600 selection:text-white overflow-x-hidden">
    <!-- Persistent DOM Splash OUTSIDE #root so React mount never restarts the animation -->
    <div id="rdx-splash">
      <div class="rdx-logo-stage">
        <div class="rdx-pulse-ring"></div>
        <div class="rdx-pulse-ring-2"></div>
        <svg id="rdx-tv-antennas" class="rdx-tv-antennas" viewBox="0 0 116 104" fill="none" aria-hidden="true">
          <defs>
            <linearGradient id="rdxMetalStem" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#e4e4e7" />
              <stop offset="35%" stop-color="#71717a" />
              <stop offset="70%" stop-color="#3f3f46" />
              <stop offset="100%" stop-color="#18181b" />
            </linearGradient>
            <linearGradient id="rdxMetalBase" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#a1a1aa" />
              <stop offset="50%" stop-color="#3f3f46" />
              <stop offset="100%" stop-color="#18181b" />
            </linearGradient>
            <radialGradient id="rdxCrimsonOrb" cx="35%" cy="30%" r="70%">
              <stop offset="0%" stop-color="#fda4af" />
              <stop offset="35%" stop-color="#f43f5e" />
              <stop offset="75%" stop-color="#e11d48" />
              <stop offset="100%" stop-color="#881337" />
            </radialGradient>
            <filter id="rdxOrbGlow" x="-60%" y="-60%" width="220%" height="220%">
              <feDropShadow dx="0" dy="0" stdDeviation="3.5" flood-color="#f43f5e" flood-opacity="0.75" />
            </filter>
          </defs>
          <!-- Metallic base socket -->
          <path d="M16 84 C18 76, 26 74, 32 78 L27 87 Z" fill="url(#rdxMetalBase)" stroke="#52525b" stroke-width="1" />
          <!-- Left upright tapered metallic horn -->
          <path d="M22 80 L10 24 L16 23 L26 78 Z" fill="url(#rdxMetalStem)" />
          <line x1="23" y1="78" x2="12" y2="25" stroke="#ffffff" stroke-opacity="0.45" stroke-width="1.1" stroke-linecap="round" />
          <!-- Right angled tapered metallic horn -->
          <path d="M24 81 L78 44 L80 49 L27 84 Z" fill="url(#rdxMetalStem)" />
          <line x1="25" y1="81" x2="77" y2="46" stroke="#ffffff" stroke-opacity="0.45" stroke-width="1.1" stroke-linecap="round" />
          <!-- 3D glossy crimson tip orbs -->
          <g filter="url(#rdxOrbGlow)">
            <circle cx="13" cy="22" r="7.5" fill="url(#rdxCrimsonOrb)" />
            <circle cx="10.8" cy="19.5" r="2.1" fill="#ffffff" fill-opacity="0.75" />
            <circle cx="81" cy="45" r="7.5" fill="url(#rdxCrimsonOrb)" />
            <circle cx="78.8" cy="42.5" r="2.1" fill="#ffffff" fill-opacity="0.75" />
          </g>
        </svg>
        <div class="rdx-boot-logo-wrap">
          <img src="/logo.png" alt="RDX-TV" class="rdx-boot-logo" />
          <div class="rdx-logo-sheen"></div>
        </div>
      </div>
      <div class="rdx-title-row">
        <span class="rdx-char rdx-char-1">R</span>
        <span class="rdx-char rdx-char-2">D</span>
        <span class="rdx-char rdx-char-3">X</span>
        <span class="rdx-char rdx-char-tv"><span class="rdx-char-tv-dash">-</span>TV</span>
        <span class="rdx-char rdx-char-dot">.</span>
        <span class="rdx-TypeCursor"></span>
      </div>
      <div class="rdx-progress-bar">
        <div class="rdx-progress-fill"></div>
      </div>
    </div>

    <div id="root"></div>
    <script>
      // Play bubbles SFX in exact sync with antenna horns animationstart
      (function() {
        var played = false;
        function playBubbles() {
          if (played) return;
          played = true;
          try {
            if (localStorage.getItem("rdx_startup_sound") === "false") return;
            var AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (!AudioCtx) return;
            var ctx = new AudioCtx();
            if (ctx.state === "suspended") ctx.resume().catch(function() {});
            function bubble(offset, f1, f2, dur, vol) {
              var t = ctx.currentTime + offset;
              var osc = ctx.createOscillator();
              var gain = ctx.createGain();
              osc.type = "sine";
              osc.frequency.setValueAtTime(f1, t);
              osc.frequency.exponentialRampToValueAtTime(f2, t + dur);
              gain.gain.setValueAtTime(0.0001, t);
              gain.gain.linearRampToValueAtTime(vol, t + 0.01);
              gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
              osc.connect(gain);
              gain.connect(ctx.destination);
              osc.start(t);
              osc.stop(t + dur + 0.02);
            }
            bubble(0.0, 310, 690, 0.085, 0.24);
            bubble(0.075, 460, 980, 0.09, 0.19);
            bubble(0.15, 640, 1220, 0.07, 0.12);
            setTimeout(function() { ctx.close().catch(function() {}); }, 600);
          } catch (e) {}
        }
        var ant = document.getElementById("rdx-tv-antennas");
        if (ant) {
          ant.addEventListener("animationstart", playBubbles, { once: true });
        }

        // On Android TV & Samsung Tizen (where native rodio is not active), also play startup.mp3
        try {
          var isDesktopTauri = Boolean(window.__TAURI_INTERNALS__) && !/android/i.test(navigator.userAgent);
          if (!isDesktopTauri && localStorage.getItem("rdx_startup_sound") !== "false") {
            var a = new Audio("/startup.mp3");
            a.volume = 0.5;
            a.play().catch(function() {});
          }
        } catch (e) {}
      })();

      // Failsafe: guarantee #rdx-splash is dismissed after at most 3s regardless of network or React state
      setTimeout(function() {
        var s = document.getElementById("rdx-splash");
        if (s && !s.classList.contains("rdx-splash-hide")) {
          s.classList.add("rdx-splash-hide");
          setTimeout(function() { s.remove(); }, 550);
        }
      }, 3000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
