[package]
name = "rdx"
version = "1.0.9"
description = "RDX Cinema Streaming Desktop Client"
authors = ["justgl"]
edition = "2021"

[lib]
name = "rdx_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["cookies", "gzip", "json", "rustls-tls", "stream"] }
scraper = "0.22"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
url = "2"
urlencoding = "2.1"
bytes = "1"
http = "1"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
thiserror = "2"

[target.'cfg(not(target_os = "android"))'.dependencies]
rodio = { version = "0.19", default-features = false, features = ["symphonia-mp3"] }

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
